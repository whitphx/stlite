name: "@stlite/react build cache"
description: >-
  Restore or save what `make react` builds (@stlite/react and everything it is
  built from: @stlite/common, @stlite/kernel, the stlite-lib and Streamlit
  wheels, the Streamlit protobufs and frontend libraries), so the jobs that
  build on @stlite/react skip its ~3-minute build when nothing it is built
  from changed.

  Run it with `step: restore` after init-all and before any `make`, and, in
  the one job that saves it, with `step: save` right after `make react`.

  A hit is extracted with one fresh mtime on every file, which is newer than
  the checkout, so Make sees those targets as up to date. Whatever does not
  line up (a missing file, a source newer than its output) Make rebuilds as
  usual, so a bad entry costs a rebuild, never a stale build.
inputs:
  step:
    description: '"restore" or "save"'
    required: true

runs:
  using: "composite"
  steps:
    - name: Compute the cache key
      if: ${{ inputs.step == 'restore' }}
      shell: bash
      run: |
        # The key is every tracked file @stlite/react's build can read, the
        # Streamlit submodule's commit, and the tools that build it. The other
        # packages' sources are left out, but not their manifests: any
        # package.json can change how the dependencies are hoisted.
        hash=$(
          {
            git ls-files --stage -- . \
              ':(exclude).changeset' \
              ':(exclude).claude' \
              ':(exclude).github/workflows' \
              ':(exclude)docs' \
              ':(exclude)packages/app-packager' \
              ':(exclude)packages/arrow-ipc-writer' \
              ':(exclude)packages/browser' \
              ':(exclude)packages/cli' \
              ':(exclude)packages/cloudflare' \
              ':(exclude)packages/desktop' \
              ':(exclude)packages/sharing' \
              ':(exclude)packages/sharing-common' \
              ':(exclude)packages/sharing-editor'
            git ls-files --stage -- ':(glob)**/package.json'
            echo "$ImageOS $ImageVersion"
            node --version
            python --version
            uv --version
            protoc --version
          } | sha256sum | cut -d' ' -f1
        )
        echo "REACT_BUILD_CACHE_KEY=react-build-v1-${RUNNER_OS}-${hash}" >> "$GITHUB_ENV"
        echo "REACT_BUILD_CACHE_ARCHIVE=${RUNNER_TEMP}/react-build.tar" >> "$GITHUB_ENV"
        echo "REACT_BUILD_CACHE_MARKER=${RUNNER_TEMP}/react-build.marker" >> "$GITHUB_ENV"

    - name: Restore the cache
      id: restore
      if: ${{ inputs.step == 'restore' }}
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ env.REACT_BUILD_CACHE_ARCHIVE }}
        key: ${{ env.REACT_BUILD_CACHE_KEY }}

    - name: Extract the restored build
      if: ${{ inputs.step == 'restore' && steps.restore.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "REACT_BUILD_CACHE_HIT=true" >> "$GITHUB_ENV"
        tar -xf "$REACT_BUILD_CACHE_ARCHIVE"
        # One mtime for every file, so that no restored target looks older
        # than another restored target it is built from.
        now=$(date +%s)
        tar -tf "$REACT_BUILD_CACHE_ARCHIVE" | grep -v '/$' | tr '\n' '\0' | xargs -0 touch -h -d "@$now"
        if make -q .make/react/.built; then
          echo "@stlite/react and everything it is built from are up to date."
        else
          echo "::warning::The restored @stlite/react build is not up to date; make will rebuild what it needs."
        fi

    - name: Mark the start of the build
      if: ${{ inputs.step == 'restore' && steps.restore.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        # `step: save` archives every file the build wrote after this.
        touch "$REACT_BUILD_CACHE_MARKER"
        sleep 1

    - name: Archive the build
      id: archive
      if: ${{ inputs.step == 'save' && env.REACT_BUILD_CACHE_HIT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Everything the build wrote, in both this repository and the
        # submodule, but not the dependencies the init step installed.
        find . \
          \( -name node_modules -o -name .git -o -path ./.venv \) -prune \
          -o \( -type f -o -type l \) -newer "$REACT_BUILD_CACHE_MARKER" -print \
          | sort > "$RUNNER_TEMP/react-build.files"
        echo "Archiving $(wc -l < "$RUNNER_TEMP/react-build.files") files"
        tar -cf "$REACT_BUILD_CACHE_ARCHIVE" -T "$RUNNER_TEMP/react-build.files"
        ls -l "$REACT_BUILD_CACHE_ARCHIVE"

    - name: Save the cache
      if: ${{ inputs.step == 'save' && steps.archive.outcome == 'success' }}
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ env.REACT_BUILD_CACHE_ARCHIVE }}
        key: ${{ env.REACT_BUILD_CACHE_KEY }}
