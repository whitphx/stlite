name: Test and Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  # https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  python-version-file: ".python-version"
  node-version-file: ".nvmrc"
  RUN_ALL_TESTS: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions: {}

jobs:
  set-build-info:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pull-request.outputs.branch || steps.push.outputs.branch }}
      head-sha: ${{ steps.pull-request.outputs.head-sha || steps.push.outputs.head-sha }}
      pr-number: ${{ steps.pull-request.outputs.pr-number }}
    steps:
      - name: Save build info (pull_request)
        if: github.event_name == 'pull_request'
        id: pull-request
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "branch=$BRANCH"
            echo "head-sha=$HEAD_SHA"
            echo "pr-number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
      - name: Save build info (push, branch)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          {
            echo "branch=$BRANCH"
            echo "head-sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

  changesets:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # `fetch-depth: 0` is required to create tags for new releases by Changesets.
          fetch-depth: 0
          # `persist-credentials: false` is important not only for security reasons
          # but also to ensure that `git push --follow-tags` run by the Changesets action in the later step
          # don't use the default GITHUB_TOKEN, which doesn't trigger other workflows such as the release workflow.
          # Ref: https://github.com/orgs/community/discussions/26220
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ".nvmrc"
          protoc: false

      # Generate a token using a GitHub App that the author owns, whitphx-changesets-bot.
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run changeset:release
        env:
          # PRs created using `GITHUB_TOKEN` doesn't trigger CI workflows, so we need to use a PAT or app token.
          # - The PAT should be fine-grained and its permissions are properly configured (R/W for Contents and Pull Requests).
          # - The app token should be generated using a GitHub App that has proper permissions (R/W for Contents and Pull Requests).
          # Ref: https://github.com/orgs/community/discussions/55906
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          # GITHUB_TOKEN: ${{ secrets.CHANGESETS_PAT }}

      - name: Save published packages info
        if: steps.changesets.outputs.published == 'true'
        run: echo '${{ steps.changesets.outputs.publishedPackages }}' > changesets-published-packages

      - name: Upload published packages info
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changesets-published-packages
          path: changesets-published-packages

  changes: # See https://github.com/dorny/paths-filter#examples
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      kernel: ${{ steps.filter.outputs.kernel == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      # stlite-lib: ${{ steps.filter.outputs.stlite-lib == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      stlite-lib: "true" # This step does not detect changes in the `streamlit` submodule that is needed to trigger the test-stlite-lib job (https://github.com/dorny/paths-filter/issues/143), so skip checking and make it always return true as a workaround.
      react: ${{ steps.filter.outputs.react == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      browser: ${{ steps.filter.outputs.browser == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      sharing: ${{ steps.filter.outputs.sharing == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      sharing-editor: ${{ steps.filter.outputs.sharing-editor == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      sharing-common: ${{ steps.filter.outputs.sharing-common == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      cli: ${{ steps.filter.outputs.cli == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
      cloudflare: ${{ steps.filter.outputs.cloudflare == 'true' || steps.filter.outputs.gha == 'true' || env.RUN_ALL_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            gha:
              - '.github/workflows/**/*'
              - '.github/actions/**/*'
            common:
              - 'packages/common/**/*'
            kernel:
              - 'packages/kernel/**/*'
              # - '!packages/kernel/py/**/*'  # Not supported by paths-filter now: https://github.com/dorny/paths-filter/issues/106
            # stlite-lib:  # We run this job anytime. See above.
            #   - 'packages/kernel/py/stlite-lib/**/*'
            #   - 'streamlit/**/*'
            react:
              - 'packages/react/**/*'
            browser:
              - 'packages/browser/**/*'
            sharing:
              - 'packages/sharing/**/*'
            sharing-editor:
              - 'packages/sharing-editor/**/*'
            sharing-common:
              - 'packages/sharing-common/**/*'
            desktop:
              - 'packages/desktop/**/*'
              - 'packages/app-packager/**/*'
            cli:
              - 'packages/cli/**/*'
              - 'packages/app-packager/**/*'
            cloudflare:
              - 'packages/cloudflare/**/*'
              - 'packages/app-packager/**/*'

  test-build-common:
    needs: changes
    if: ${{ needs.changes.outputs.common == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/common

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}
          protoc: false

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
      - run: yarn test
      - run: yarn build

  test-kernel:
    needs: changes
    if: ${{ needs.changes.outputs.kernel == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/kernel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format

      - run: make kernel-test
        working-directory: .

  test-stlite-lib:
    needs: changes
    if: ${{ needs.changes.outputs.stlite-lib == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Set up Streamlit and build proto
        run: |
          . .venv/bin/activate
          make streamlit-proto

      - name: Run Ruff
        run: |
          . .venv/bin/activate
          cd packages/kernel/py/stlite-lib
          uv run ruff check --output-format=github .
          uv run ruff format . --check

      - name: Run pyright
        run: |
          . .venv/bin/activate
          cd packages/kernel/py/stlite-lib
          uv run pyright

      - name: Run pytest
        shell: bash
        run: |
          . .venv/bin/activate
          cd packages/kernel/py/stlite-lib
          uv run pytest -v

  test-browser:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/browser

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
      - run: yarn test

  test-react:
    needs: changes
    if: ${{ needs.changes.outputs.react == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/react

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
      - run: yarn test

  test-sharing:
    needs: changes
    if: ${{ needs.changes.outputs.sharing == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sharing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}
          protoc: false

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
    # - run: yarn test

  test-sharing-editor:
    needs: changes
    if: ${{ needs.changes.outputs.sharing-editor == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sharing-editor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}

      - run: make sharing-common
        working-directory: .

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
      - run: yarn test

  test-sharing-common:
    needs: changes
    if: ${{ needs.changes.outputs.sharing-common == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sharing-common

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
      - run: yarn build:proto
      - run: yarn test

  test-desktop:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # The desktop package contains OS-dependent file paths manipulations differing between POSIX and Windows.

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: packages/desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}
          protoc: false

      - name: Lint
        # Skip on non-Linux because `git checkout` on Windows converts LF -> CRLF
        # (autocrlf default) and oxfmt 0.45.0 rejects `endOfLine: "auto"` (only
        # `lf`/`crlf`/`cr` are accepted), so `yarn check:format` fails on every
        # file. Lint/format correctness is platform-independent, so running on
        # ubuntu-latest is sufficient. Revisit if oxfmt adds `"auto"` support.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          yarn check:lint
          yarn check:format
      - run: yarn test

  test-cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      # Generate `_proto/models.py` and `_runtime_version.py` first — pyright
      # follows imports through them, and the parity test exec's both bins
      # which import them at runtime. The JS bundle (`make cli`) is also
      # needed for the parity test, so build it here in one shot.
      - name: Build cli + Python proto + Python runtime-version
        run: |
          . .venv/bin/activate
          make cli cli-py-proto cli-py-runtime-version

      - name: Lint (TS)
        run: |
          yarn workspace @stlite/cli check:lint
          yarn workspace @stlite/cli check:format

      - name: Lint (Python)
        run: |
          . .venv/bin/activate
          uv run --project packages/cli/py ruff check packages/cli/py
          uv run --project packages/cli/py ruff format --check packages/cli/py

      - name: Pyright (Python)
        run: |
          . .venv/bin/activate
          uv run --project packages/cli/py pyright packages/cli/py

      - name: Pytest (Python)
        run: |
          . .venv/bin/activate
          uv run --project packages/cli/py pytest packages/cli/py/tests

      - name: Vitest (TS, includes cross-runtime parity)
        # vitest auto-detects CI=true and runs once instead of watching, so
        # no explicit `--run` flag needed.
        run: yarn workspace @stlite/cli test

  test-cloudflare:
    needs: changes
    if: ${{ needs.changes.outputs.cloudflare == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/cloudflare

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}
          protoc: false

      - name: Lint
        run: |
          yarn check:lint
          yarn check:format
          uv run --project . ruff check --output-format=github py tests
          uv run --project . ruff format --check py tests

      # The pytest suite covers the Worker runtime modules and the Python
      # vendoring helper; it needs uv. The Node toolchain above is for the yarn
      # lint/format/test:js steps.
      - run: yarn test

      # Cross-platform unit tests for the Node fs helpers (dir mirroring,
      # wheel lookup). test-cloudflare-windows runs these same tests on Windows
      # for cross-platform signal.
      - run: yarn test:js

  test-cloudflare-windows:
    # The stlite-cloudflare build is cross-platform; this job is its Windows
    # coverage. It runs only the Node fs-helper tests, not the full build, for
    # the reason called out at the `yarn test:js` line below.
    needs: changes
    if: ${{ needs.changes.outputs.cloudflare == 'true' }}

    runs-on: windows-latest

    defaults:
      run:
        working-directory: packages/cloudflare

    steps:
      # Submodules are needed only so the yarn workspace install can resolve all
      # members (the streamlit frontend workspaces); the helper tests themselves
      # don't touch the submodule.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}
          protoc: false

      # The end-to-end build can't be verified on Windows yet: its one required
      # subprocess, `uv run pywrangler sync`, aborts there — pywrangler
      # (Cloudflare's workers-py) fails to locate its pyodide-venv interpreter at
      # `.venv-workers\pyodide-venv\Scripts\python.exe`. That's upstream, not our
      # code, so until it's fixed the full build runs on Linux
      # (verify-cloudflare-standalone) and these Node helper tests give the
      # Windows signal for our fs helpers.
      - run: yarn test:js

  build-browser:
    if: ${{ ! failure() }} # This job should run even if the depending jobs are skipped, but not when those jobs failed: https://qiita.com/abetomo/items/d9ede7dbeeb24f723fc5#%E8%A8%AD%E5%AE%9A%E4%BE%8B4
    needs:
      [
        set-build-info,
        test-kernel,
        test-stlite-lib,
        test-build-common,
        test-browser,
      ]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      # PUBLIC_URL here is set as a relative path, which is possible to the trick introduced at https://github.com/whitphx/stlite/pull/143.
      - name: Set PUBLIC_URL
        run: echo "PUBLIC_URL=." >> $GITHUB_ENV
      - name: Build @stlite/browser
        run: |
          . .venv/bin/activate
          make browser

      - name: Upload bundle visualizer report (@stlite/browser)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/browser/stats/browser.html
          name: visualizer-browser
          if-no-files-found: error

      - name: Package
        working-directory: packages/browser
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/browser/package.tgz
          name: stlite-browser

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/browser/package.tgz
        # This step may fail when the PR is created by an external contributor and the CI is run in their scope.
        # We can ignore such failures because the following jobs such as E2E-testing in the post-build workflow don't necessarily need the attestation,
        # while the verification is done when publishing the artifact.
        continue-on-error: true

      - name: "Inform the package stats of @stlite/browser"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: browser
          name: "@stlite/browser"
          input-path: packages/browser/package.tgz
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

      # Also get stats of the built wheel files of stlite-lib and streamlit in this job.
      - name: Get the built wheel file path
        id: get-wheel-file-path
        run: |
          pushd packages/kernel/py/stlite-lib/dist
          echo "STLITE_LIB_WHEEL_FILEPATH=$(find $(pwd) -name "stlite_lib-*-py3-none-any.whl" -print -quit)" >> $GITHUB_OUTPUT
          popd
          pushd packages/kernel/py/streamlit/lib/dist
          echo "STREAMLIT_WHEEL_FILEPATH=$(find $(pwd) -name "streamlit-*.whl" -print -quit)" >> $GITHUB_OUTPUT
          popd
      - name: "Inform the package stats of stlite-lib wheel"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: stlite-lib-wheel
          name: "stlite-lib wheel (built as a part of @stlite/browser)"
          input-path: ${{ steps.get-wheel-file-path.outputs.STLITE_LIB_WHEEL_FILEPATH }}
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}
      - name: "Inform the package stats of streamlit wheel"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: streamlit-wheel
          name: "streamlit wheel (built as a part of @stlite/browser)"
          input-path: ${{ steps.get-wheel-file-path.outputs.STREAMLIT_WHEEL_FILEPATH }}
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  build-react:
    if: ${{ ! failure() }} # This job should run even if the depending jobs are skipped, but not when those jobs failed.
    needs:
      [
        set-build-info,
        test-kernel,
        test-stlite-lib,
        test-build-common,
        test-react,
      ]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Build @stlite/react
        run: |
          . .venv/bin/activate
          make react

      - name: Package
        working-directory: packages/react
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/react/package.tgz
          name: stlite-react

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/react/package.tgz
        continue-on-error: true

      - name: "Inform the package stats of @stlite/react"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: react
          name: "@stlite/react"
          input-path: packages/react/package.tgz
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  build-sharing:
    if: ${{ ! failure() }} # This job should run even if the depending jobs are skipped, but not when those jobs failed: https://qiita.com/abetomo/items/d9ede7dbeeb24f723fc5#%E8%A8%AD%E5%AE%9A%E4%BE%8B4
    needs:
      [
        set-build-info,
        test-kernel,
        test-stlite-lib,
        test-sharing-common,
        test-sharing,
      ]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}
      ## Build and upload @stlite/sharing
      - name: Set EDITOR_APP_ORIGIN (preview)
        if: ${{ needs.set-build-info.outputs.branch != github.event.repository.default_branch }}
        run: echo "EDITOR_APP_ORIGIN_REGEX=^https://[a-z0-9-]+\.stlite-sharing-editor\.pages\.dev$" >> $GITHUB_ENV
      - name: Set EDITOR_APP_ORIGIN (main branch)
        if: ${{ needs.set-build-info.outputs.branch == github.event.repository.default_branch }}
        run: echo "EDITOR_APP_ORIGIN=https://edit.share.stlite.net" >> $GITHUB_ENV
      - name: Build @stlite/sharing
        run: |
          . .venv/bin/activate
          make sharing

      - name: Upload bundle visualizer report (@stlite/sharing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/sharing/stats/sharing.html
          name: visualizer-sharing
          if-no-files-found: error

      - name: Upload the built directory as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/sharing/build
          name: stlite-sharing

      - name: "Inform the package stats"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: sharing
          name: "stlite sharing"
          input-path: packages/sharing/build
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  build-sharing-editor:
    if: ${{ ! failure() }} # This job should run even if the depending jobs are skipped, but not when those jobs failed: https://qiita.com/abetomo/items/d9ede7dbeeb24f723fc5#%E8%A8%AD%E5%AE%9A%E4%BE%8B4
    needs:
      [
        set-build-info,
        test-build-common,
        test-sharing-editor,
        test-sharing-common,
      ]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}

      - name: Set build option envvar for the preview build
        if: ${{ needs.set-build-info.outputs.branch != github.event.repository.default_branch }}
        run: echo "RESOLVE_SHARING_APP_URL_RUNTIME_FROM_EXTERNAL_FILE=true" >> $GITHUB_ENV
      - name: Set SHARING_APP_URL (main branch)
        if: ${{ needs.set-build-info.outputs.branch == github.event.repository.default_branch }}
        run: echo "SHARING_APP_URL=https://share.stlite.net/" >> $GITHUB_ENV
      - run: make sharing-editor

      - name: Upload bundle visualizer report (@stlite/sharing-editor)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/sharing-editor/stats/sharing-editor.html
          name: visualizer-sharing-editor
          if-no-files-found: error

      - name: Upload the built directory as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/sharing-editor/dist
          name: stlite-sharing-editor

      - name: "Inform the package stats"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: sharing-editor
          name: "stlite sharing editor"
          input-path: packages/sharing-editor/dist
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  build-desktop:
    if: ${{ ! failure() }} # This job should run even if the depending jobs are skipped, but not when those jobs failed: https://qiita.com/abetomo/items/d9ede7dbeeb24f723fc5#%E8%A8%AD%E5%AE%9A%E4%BE%8B4
    needs:
      [
        set-build-info,
        test-build-common,
        test-kernel,
        test-stlite-lib,
        test-desktop,
      ]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Build @stlite/desktop
        run: |
          . .venv/bin/activate
          make desktop

      - name: Upload bundle visualizer report (@stlite/desktop)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/desktop/stats/desktop.html
          name: visualizer-desktop
          if-no-files-found: error

      - name: Package
        working-directory: packages/desktop
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/desktop/package.tgz
          name: stlite-desktop

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/desktop/package.tgz
        # This step may fail when the PR is created by an external contributor and the CI is run in their scope.
        # We can ignore such failures because the following jobs such as E2E-testing in the post-build workflow don't necessarily need the attestation,
        # while the verification is done when publishing the artifact.
        continue-on-error: true

      - name: "Inform the package stats of @stlite/desktop"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: desktop
          name: "@stlite/desktop"
          input-path: packages/desktop/package.tgz
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  build-cli:
    if: ${{ ! failure() }} # This job should run even if the depending jobs are skipped, but not when those jobs failed.
    needs: [set-build-info, test-build-common, test-cli]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Build @stlite/cli
        run: |
          . .venv/bin/activate
          make cli

      - name: Package
        working-directory: packages/cli
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/cli/package.tgz
          name: stlite-cli

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/cli/package.tgz
        continue-on-error: true

      - name: "Inform the package stats of @stlite/cli"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: cli
          name: "@stlite/cli"
          input-path: packages/cli/package.tgz
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  build-cloudflare:
    # Unlike the always-built packages above, this build compiles the
    # Cloudflare-variant Streamlit frontend and builds the pinned runtime
    # wheels, so it only runs when the cloudflare package (or a dependency)
    # changed; RUN_ALL_TESTS makes that always true on main, which is what the
    # postbuild publish/deploy jobs rely on.
    if: ${{ ! failure() && needs.changes.outputs.cloudflare == 'true' }}
    needs:
      [set-build-info, changes, test-kernel, test-stlite-lib, test-cloudflare]

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - name: Build @stlite/cloudflare
        run: make cloudflare

      - name: Package
        working-directory: packages/cloudflare
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/cloudflare/package.tgz
          name: stlite-cloudflare

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/cloudflare/package.tgz
        continue-on-error: true

      - name: "Inform the package stats of @stlite/cloudflare"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: cloudflare
          name: "@stlite/cloudflare"
          input-path: packages/cloudflare/package.tgz
          pr-number: ${{ needs.set-build-info.outputs.pr-number }}
          sticky-id: ${{ needs.set-build-info.outputs.head-sha }}

  verify-cloudflare-standalone:
    # Build the hello demo from the PACKED TARBALL, outside the monorepo, the way
    # a published-package user would (`npm i @stlite/cloudflare && stlite-
    # cloudflare build`). This is both the merge gate — proving the published
    # package builds the real demo end-to-end — and the producer of the artifact
    # that postbuild deploys. Building it here, in this PR-triggered no-secrets
    # context, is deliberate: postbuild only ever deploys the prebuilt artifact,
    # never runs PR build code with the deploy secrets. The streamlit submodule
    # isn't fetched; the tarball ships its own prebuilt frontend and wheels.
    #
    # ubuntu-only: Windows can't run the end-to-end build yet (see the pywrangler
    # note in the test-cloudflare-windows job above). Our own build code is
    # cross-platform and gets Windows coverage there via the helper tests.
    if: ${{ ! failure() && needs.changes.outputs.cloudflare == 'true' }}
    needs: [set-build-info, changes, build-cloudflare]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.node-version-file }}

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stlite-cloudflare
          path: ${{ runner.temp }}/pkg

      - name: Build the hello sample from the packed tarball
        working-directory: ${{ runner.temp }}
        run: |
          set -eux
          mkdir -p standalone
          cd standalone
          npm init -y >/dev/null
          npm install "${{ runner.temp }}/pkg/package.tgz" wrangler
          npx stlite-cloudflare build \
            "$GITHUB_WORKSPACE/packages/cloudflare/samples/hello/app" \
            -o ./dist --name stlite-cloudflare --plain-worker
          test -f dist/python_modules/stlite_cloudflare/entry.py
          test ! -d dist/python_modules/streamlit
          grep -q "window.__streamlit" dist/assets/index.html
          python3 -m zipfile -l dist/assets/_stlite/python-modules.zip | grep -q "streamlit/"
          tar -tzf dist/assets/_stlite/extracted-modules.tar.gz | grep -q "_stlite_cloudflare_app/streamlit_app.py"

      # The script (python_modules incl. the native-extension packages that
      # can't move to assets) must stay under Cloudflare's 10 MiB-gzip
      # (10240 KiB) paid cap, and sits close to it; trip just below the hard
      # cap so a crossing fails in CI instead of at deploy time.
      - name: Validate the Worker bundle
        working-directory: ${{ runner.temp }}/standalone/dist
        run: |
          set -eux
          npx wrangler deploy --dry-run | tee dry-run.log
          gzip_kib=$(grep -o 'gzip: [0-9.]*' dry-run.log | grep -o '[0-9.]*')
          awk -v s="$gzip_kib" 'BEGIN { if (s+0 > 10200) { print "Script gzip " s " KiB exceeds the 10200 KiB budget (hard limit 10240)"; exit 1 } }'

      # wrangler dev runs the Worker in local workerd — the same runtime as
      # production — so this drives the packaged app end-to-end in a real
      # browser: index HTML, static assets, health endpoints, and the
      # Streamlit WebSocket session reaching CONNECTED.
      - name: Smoke-test the Worker in a real browser
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          npm install "playwright@^1.61.1"
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/packages/cloudflare/samples/hello/scripts/browser-smoke.mjs" .
          (cd dist && npx wrangler dev --port 8787 >"$RUNNER_TEMP/wrangler-dev.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8787/_stcore/health && break
            sleep 2
          done
          STLITE_SMOKE_TIMEOUT_MS=120000 node browser-smoke.mjs || {
            echo "::group::wrangler dev log"
            cat "$RUNNER_TEMP/wrangler-dev.log"
            echo "::endgroup::"
            exit 1
          }

      # The default Durable Object deployment path gets its own standalone
      # build (the hello build above uses --plain-worker, which is a distinct
      # mode): the minimal sample built with default settings, verified
      # structurally and by wrangler dry-run.
      - name: Build the minimal sample in default Durable Object mode
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          # Reuse the wheel cache from the hello build (cache dirs are keyed
          # by output dir basename).
          cp -R .dist.stlite-cloudflare-cache .dist-do.stlite-cloudflare-cache
          npx stlite-cloudflare build \
            "$GITHUB_WORKSPACE/packages/cloudflare/samples/minimal/app" \
            -o ./dist-do --name stlite-cloudflare-minimal
          grep -q '"STLITE_SERVER"' dist-do/wrangler.jsonc
          grep -q "StliteServer" dist-do/src/entry.py
          cd dist-do && npx wrangler deploy --dry-run

      # Boot the DO-mode Worker in local workerd: the health request goes
      # through the router entrypoint into the STLITE_SERVER Durable Object
      # instance, which cold-boots the packaged Streamlit runtime — the
      # actual default request-routing path.
      - name: Smoke-test the Durable Object mode in local workerd
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          (cd dist-do && npx wrangler dev --port 8788 >"$RUNNER_TEMP/wrangler-dev-do.log" 2>&1 &)
          ok=""
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8788/_stcore/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::group::wrangler dev (DO) log"
            cat "$RUNNER_TEMP/wrangler-dev-do.log"
            echo "::endgroup::"
            exit 1
          fi
          curl -sf http://127.0.0.1:8788/ | grep -q "window.__streamlit"
          # Real-browser smoke in DO mode (playwright was installed by the
          # plain-worker smoke step above): renders over the WebSocket
          # session and asserts the Worker-env var surfaced via st.secrets.
          cp "$GITHUB_WORKSPACE/packages/cloudflare/samples/minimal/scripts/browser-smoke.mjs" ./minimal-smoke.mjs
          STLITE_CLOUDFLARE_URL=http://127.0.0.1:8788/ STLITE_SMOKE_TIMEOUT_MS=120000 node minimal-smoke.mjs || {
            echo "::group::wrangler dev (DO) log"
            cat "$RUNNER_TEMP/wrangler-dev-do.log"
            echo "::endgroup::"
            exit 1
          }

      # Every wrangler-config shape the merger supports (named environments,
      # legacy migrations, exports style, external bindings, ...) validated
      # against real wrangler.
      - name: Dry-run the supported wrangler-config shapes
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          node "$GITHUB_WORKSPACE/packages/cloudflare/scripts/dryrun-config-matrix.mjs" dist-do

      # The dist built above is the sample postbuild deploys. Hidden files are
      # excluded by default, dropping the build-only .venv/.venv-workers/.wrangler
      # dirs pywrangler leaves in the output — wrangler doesn't need them.
      - name: Upload the built sample as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/standalone/dist
          name: stlite-cloudflare-sample

  build-docs:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}

      - name: Build docs
        run: yarn build
        working-directory: docs

      - name: Upload the built directory as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: docs/dist
          name: stlite-docs

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: docs/dist
        continue-on-error: true
