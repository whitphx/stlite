[project]
name = "stlite-cloudflare"
version = "0.1.0"
description = "Run the stlite Streamlit runtime on Cloudflare Python Workers."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "altair>=4.0,<7,!=5.4.0,!=5.4.1",
  "anyio>=4.0.0",
  "blinker>=1.5.0,<2",
  "cachetools>=5.5,<8",
  "itsdangerous>=2.1.2",
  "numpy>=1.23,<3",
  "packaging>=20",
  "pandas>=1.4.0,<4",
  "pillow>=7.1.0,<13",
  "protobuf>=7.34.1,<8",
  "python-multipart>=0.0.10",
  "starlette>=0.40.0",
  "tenacity>=8.1.0,<10",
  "toml>=0.10.1",
  "typing-extensions>=4.10.0,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "starlette>=0.37",
  "stlite-lib",
  "streamlit",
  "workers-py",
  "workers-runtime-sdk",
]

[tool.uv.sources]
stlite-lib = { path = "../packages/kernel/py/stlite-lib" }
streamlit = { path = "../streamlit/lib" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
