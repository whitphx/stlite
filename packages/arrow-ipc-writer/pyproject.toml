[project]
name = "arrow-ipc-writer"
version = "0.1.0"
description = "A pure-Python Arrow IPC stream writer for pandas DataFrames, for runtimes without pyarrow"
readme = "README.md"
# @stlite/cloudflare, which this is for, runs Python 3.13.
requires-python = ">=3.13"
authors = [
  { name = "Yuichiro Tachibana (Tsuchiya)", email = "t.yic.yt@gmail.com" },
]
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pandas>=2.3"]

[dependency-groups]
dev = [
  "pandas-stubs>=2.2.3.241009",
  # Only to check the output against; the package itself never imports it.
  "pyarrow>=24.0.0",
  "pyright>=1.1.384",
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["arrow_ipc_writer"]
# The oldest Python it runs on: @stlite/cloudflare's runtime.
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
