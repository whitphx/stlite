[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "altair>=4.0,<7,!=5.4.0,!=5.4.1",
  "anyio>=4.0.0",
  "blinker>=1.5.0,<2",
  "cachetools>=5.5,<8",
  "itsdangerous>=2.1.2",
  "numpy>=1.23,<3",
  "packaging>=20",
  "pandas>=1.4.0,<4",
  "pillow>=7.1.0,<13",
  "protobuf>=7.34.1,<8",
  "pyodide-http>=0.2.1",
  "python-multipart>=0.0.10",
  "starlette>=0.40.0",
  "tenacity>=8.1.0,<10",
  "toml>=0.10.1",
  "typing-extensions>=4.10.0,<5",
  "workers-runtime-sdk",
]

[dependency-groups]
dev = ["workers-py"]

[tool.uv]
