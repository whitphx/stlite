          input-path: packages/sharing/build
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

  # The builds that take seconds each, in one job so that they share one
  # checkout and setup and one runner. @stlite/sharing-editor goes last:
  # its build options are set in $GITHUB_ENV, which would leak into the
  # builds after it.
  build-docs-cli-sharing-editor:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
