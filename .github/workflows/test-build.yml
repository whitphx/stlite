name: Test and Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  # https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  python-version-file: ".python-version"
  node-version-file: ".nvmrc"
  RUN_ALL_TESTS: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  # The build info the build jobs report the package stats under, and pick
  # their build options by.
  BUILD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILD_PR_NUMBER: ${{ github.event.pull_request.number }}

permissions: {}

jobs:
  changesets:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-depth: 0` is required to create tags for new releases by Changesets.
          fetch-depth: 0
          # `persist-credentials: false` keeps the checkout token out of the git config.
          # The Changesets action authenticates its own pushes with the `github-token` below,
          # so no git credentials are needed here.
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ".nvmrc"
          protoc: false

      # Generate a token using a GitHub App that the author owns, whitphx-changesets-bot.
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: npm run changeset:release
          # Pushing through the GitHub API (the default) builds the release commit with
          # `@changesets/ghcommit`, which stats every path `git diff` reports as changed.
          # CI leaves tracked content in the `streamlit` submodule modified, so that path is
          # a directory, and its executable bits fail the library's non-executable check:
          # "Unexpected executable file at streamlit". The Git CLI stages with `git add .`,
          # which skips a submodule whose recorded commit has not moved.
          push-with-git-cli: true
          # PRs created using `GITHUB_TOKEN` don't trigger CI workflows, so we need to use a PAT or app token.
          # - The PAT should be fine-grained and its permissions are properly configured (R/W for Contents and Pull Requests).
          # - The app token should be generated using a GitHub App that has proper permissions (R/W for Contents and Pull Requests).
          # Ref: https://github.com/orgs/community/discussions/55906
          github-token: ${{ steps.generate-token.outputs.token }}
          # github-token: ${{ secrets.CHANGESETS_PAT }}

      - name: Save published packages info
        if: steps.changesets.outputs.published == 'true'
        run: echo '${{ steps.changesets.outputs.published-packages }}' > changesets-published-packages

      - name: Upload published packages info
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changesets-published-packages
          path: changesets-published-packages

  changes: # See https://github.com/dorny/paths-filter#examples
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      kernel: ${{ steps.filter.outputs.kernel == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      # stlite-lib: ${{ steps.filter.outputs.stlite-lib == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      stlite-lib: "true" # This step does not detect changes in the `streamlit` submodule that is needed to trigger the test-stlite-lib job (https://github.com/dorny/paths-filter/issues/143), so skip checking and make it always return true as a workaround.
      react: ${{ steps.filter.outputs.react == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      browser: ${{ steps.filter.outputs.browser == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      sharing: ${{ steps.filter.outputs.sharing == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      sharing-editor: ${{ steps.filter.outputs.sharing-editor == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      sharing-common: ${{ steps.filter.outputs.sharing-common == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      cli: ${{ steps.filter.outputs.cli == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      cloudflare: ${{ steps.filter.outputs.cloudflare == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
      arrow-ipc-writer: ${{ steps.filter.outputs.arrow-ipc-writer == 'true' || steps.filter.outputs.global == 'true' || env.RUN_ALL_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # The lockfiles are why this reaches past the obvious: a single
            # bump can shift resolution for any package, not only the one
            # whose manifest changed.
            global:
              - '.github/workflows/**/*'
              - '.github/actions/**/*'
              - 'Makefile'
              - 'tsconfig.json'
              - '.nvmrc'
              - '.python-version'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.npmrc'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'packages/tooling/**/*'
            common:
              - 'packages/common/**/*'
            kernel:
              - 'packages/kernel/**/*'
              # A submodule shows up as its gitlink's own path, so the pattern
              # has to be the bare path; `streamlit/**/*` never matches,
              # because the contents live in another repository and are never
              # listed.
              - 'streamlit'
              # - '!packages/kernel/py/**/*'  # Not supported by paths-filter now: https://github.com/dorny/paths-filter/issues/106
            # stlite-lib:  # We run this job anytime. See above.
            #   - 'packages/kernel/py/stlite-lib/**/*'
            #   - 'streamlit/**/*'
            react:
              - 'packages/react/**/*'
              - 'streamlit'
            browser:
              - 'packages/browser/**/*'
            sharing:
              - 'packages/sharing/**/*'
            sharing-editor:
              - 'packages/sharing-editor/**/*'
            sharing-common:
              - 'packages/sharing-common/**/*'
            desktop:
              - 'packages/desktop/**/*'
              - 'packages/app-packager/**/*'
            cli:
              - 'packages/cli/**/*'
              - 'packages/app-packager/**/*'
            cloudflare:
              - 'packages/cloudflare/**/*'
              - 'packages/app-packager/**/*'
              # The Worker vendors these, and serializes dataframes with them
              # (stlite-lib's pyarrow stand-in, backed by arrow-ipc-writer).
              - 'packages/kernel/py/stlite-lib/**/*'
              - 'packages/arrow-ipc-writer/**/*'
              - 'streamlit'
            arrow-ipc-writer:
              - 'packages/arrow-ipc-writer/**/*'

  test-kernel:
    needs: changes
    if: ${{ needs.changes.outputs.kernel == 'true' }}

    # The suite boots Pyodide in each test file, one file at a time (see
    # packages/kernel/vitest.config.ts), and src/worker-runtime.test.ts takes
    # three quarters of its 2.5-4 minutes. That file and the rest run in
    # parallel jobs, each with the same per-file serialization.
    strategy:
      fail-fast: false
      matrix:
        include:
          - files: worker-runtime
            vitest-args: src/worker-runtime.test.ts
          - files: others
            vitest-args: --exclude src/worker-runtime.test.ts

    name: test-kernel (${{ matrix.files }})

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/kernel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      # The wheels and @stlite/common the tests load, if build-react has
      # already built them from the same sources.
      - uses: ./.github/actions/react-build-cache
        with:
          step: restore
      # The cache also holds @stlite/kernel's own build, which `make
      # kernel-test` doesn't build, and vitest would collect the compiled
      # *.spec.js files in its dist/ as tests of their own.
      - name: Remove @stlite/kernel's restored build
        run: rm -rf dist ./*.tsbuildinfo

      - name: Lint
        if: ${{ matrix.files == 'others' }}
        run: |
          yarn check:lint
          yarn check:format

      # What `make kernel-test` runs, with the matrix's share of the files.
      - name: Build the wheels and @stlite/common the tests load
        run: make common stlite-lib-wheel streamlit-wheel
        working-directory: .
      - name: Test
        run: yarn test ${{ matrix.vitest-args }}

  # The lint and unit tests of every package except @stlite/kernel (whose
  # suite boots Pyodide and runs for minutes on its own). Each package used to
  # get a job of its own, which spent ~3 minutes on checkout and setup to run
  # a few seconds of checks, and queued for a runner besides.
  #
  # Each step runs when its package (or a dependency) changed, and
  # `!cancelled()` keeps the later packages' checks running after an earlier
  # one fails, so a run still reports every failure. The steps that run with
  # nothing built come first, then the ones that build their prerequisites,
  # so that each package's checks run in the state their own job left them.
  test:
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.common == 'true' ||
        needs.changes.outputs.stlite-lib == 'true' ||
        needs.changes.outputs.browser == 'true' ||
        needs.changes.outputs.react == 'true' ||
        needs.changes.outputs.sharing == 'true' ||
        needs.changes.outputs.sharing-editor == 'true' ||
        needs.changes.outputs.sharing-common == 'true' ||
        needs.changes.outputs.desktop == 'true' ||
        needs.changes.outputs.cli == 'true' ||
        needs.changes.outputs.arrow-ipc-writer == 'true' ||
        needs.changes.outputs.cloudflare == 'true'
      }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks only that the minor version in `.python-version` matches the
      # Python bundled in Pyodide; it does not check that the patch is the
      # latest CPython release. Renovate's patch-only `pyenv` updates keep the
      # patch current (see `.github/renovate.json5`), and failing here on every
      # new CPython release would turn unrelated PRs red until that bump lands.
      # This catches a minor mismatch in seconds (for example, a Pyodide bump to
      # a new Python minor that leaves `.python-version` behind), before the
      # builds below reach the same check in the Makefile's `streamlit-wheel`
      # target. It runs first in this job, which always runs, instead of
      # taking a runner of its own; `!cancelled()` on the steps below keeps
      # every package's checks reporting when it fails.
      - name: Check the Python version
        run: .github/scripts/check-python-version.sh

      - uses: ./.github/actions/init-all
        if: ${{ !cancelled() }}
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}
          # This job saves the dependency caches every other job restores.
          # It runs on every push, and isn't on the critical path.
          save-caches: true

      ## @stlite/browser
      - name: "@stlite/browser: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.browser == 'true' }}
        working-directory: packages/browser
        run: |
          yarn check:lint
          yarn check:format
      - name: "@stlite/browser: Test"
        if: ${{ !cancelled() && needs.changes.outputs.browser == 'true' }}
        working-directory: packages/browser
        run: yarn test

      ## @stlite/react
      - name: "@stlite/react: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.react == 'true' }}
        working-directory: packages/react
        run: |
          yarn check:lint
          yarn check:format
      - name: "@stlite/react: Test"
        if: ${{ !cancelled() && needs.changes.outputs.react == 'true' }}
        working-directory: packages/react
        run: yarn test

      ## @stlite/sharing
      - name: "@stlite/sharing: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.sharing == 'true' }}
        working-directory: packages/sharing
        run: |
          yarn check:lint
          yarn check:format

      ## @stlite/desktop
      # Also tested on Windows by test-windows: the package contains OS-dependent
      # file path manipulations differing between POSIX and Windows.
      - name: "@stlite/desktop: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.desktop == 'true' }}
        working-directory: packages/desktop
        run: |
          yarn check:lint
          yarn check:format
      - name: "@stlite/desktop: Test"
        if: ${{ !cancelled() && needs.changes.outputs.desktop == 'true' }}
        working-directory: packages/desktop
        run: yarn test

      ## arrow-ipc-writer
      - name: "arrow-ipc-writer: Ruff"
        if: ${{ !cancelled() && needs.changes.outputs.arrow-ipc-writer == 'true' }}
        working-directory: packages/arrow-ipc-writer
        run: |
          uv run --package arrow-ipc-writer ruff check --output-format=github .
          uv run --package arrow-ipc-writer ruff format --check .
      - name: "arrow-ipc-writer: Pyright"
        if: ${{ !cancelled() && needs.changes.outputs.arrow-ipc-writer == 'true' }}
        working-directory: packages/arrow-ipc-writer
        run: uv run --package arrow-ipc-writer pyright
      - name: "arrow-ipc-writer: Pytest"
        if: ${{ !cancelled() && needs.changes.outputs.arrow-ipc-writer == 'true' }}
        working-directory: packages/arrow-ipc-writer
        run: uv run --package arrow-ipc-writer pytest -v
      # The writer is for @stlite/cloudflare, whose runtime (Pyodide 0.29.x)
      # has older Python and pandas than the workspace locks.
      - name: "arrow-ipc-writer: Pytest on Cloudflare's runtime versions"
        if: ${{ !cancelled() && needs.changes.outputs.arrow-ipc-writer == 'true' }}
        working-directory: packages/arrow-ipc-writer
        run: scripts/test-on-cloudflare-runtime.sh -v

      ## @stlite/cloudflare
      - name: "@stlite/cloudflare: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.cloudflare == 'true' }}
        working-directory: packages/cloudflare
        run: |
          yarn check:lint
          yarn check:format
          uv run --project . ruff check --output-format=github py tests
          uv run --project . ruff format --check py tests
      # The pytest suite covers the Worker runtime modules and the Python
      # vendoring helper; it needs uv.
      - name: "@stlite/cloudflare: Test"
        if: ${{ !cancelled() && needs.changes.outputs.cloudflare == 'true' }}
        working-directory: packages/cloudflare
        run: yarn test
      # Cross-platform unit tests for the Node fs helpers (dir mirroring,
      # wheel lookup). test-windows runs these same tests on Windows for
      # cross-platform signal.
      - name: "@stlite/cloudflare: Test (JS)"
        if: ${{ !cancelled() && needs.changes.outputs.cloudflare == 'true' }}
        working-directory: packages/cloudflare
        run: yarn test:js

      ## stlite-lib
      - name: "stlite-lib: Set up Streamlit and build proto"
        id: stlite-lib-proto
        if: ${{ !cancelled() && needs.changes.outputs.stlite-lib == 'true' }}
        run: |
          . .venv/bin/activate
          make streamlit-proto
      - name: "stlite-lib: Ruff"
        if: ${{ !cancelled() && steps.stlite-lib-proto.outcome == 'success' }}
        run: |
          . .venv/bin/activate
          cd packages/kernel/py/stlite-lib
          uv run ruff check --output-format=github .
          uv run ruff format . --check
      - name: "stlite-lib: Pyright"
        if: ${{ !cancelled() && steps.stlite-lib-proto.outcome == 'success' }}
        run: |
          . .venv/bin/activate
          cd packages/kernel/py/stlite-lib
          uv run pyright
      - name: "stlite-lib: Pytest"
        if: ${{ !cancelled() && steps.stlite-lib-proto.outcome == 'success' }}
        run: |
          . .venv/bin/activate
          cd packages/kernel/py/stlite-lib
          uv run pytest -v
      # The pyarrow shim is for @stlite/cloudflare, whose runtime (Pyodide
      # 0.29.x) has older Python and pandas than the workspace locks.
      - name: "stlite-lib: Run the pyarrow shim's tests on Cloudflare's runtime versions"
        if: ${{ !cancelled() && steps.stlite-lib-proto.outcome == 'success' }}
        working-directory: packages/kernel/py/stlite-lib
        run: scripts/test-pyarrow-shim-on-cloudflare-runtime.sh -v

      ## @stlite/common
      - name: "@stlite/common: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.common == 'true' }}
        working-directory: packages/common
        run: |
          yarn check:lint
          yarn check:format
      - name: "@stlite/common: Test"
        if: ${{ !cancelled() && needs.changes.outputs.common == 'true' }}
        working-directory: packages/common
        run: yarn test
      - name: "@stlite/common: Build"
        if: ${{ !cancelled() && needs.changes.outputs.common == 'true' }}
        working-directory: packages/common
        run: yarn build

      ## @stlite/sharing-common
      - name: "@stlite/sharing-common: Lint"
        if: ${{ !cancelled() && needs.changes.outputs.sharing-common == 'true' }}
        working-directory: packages/sharing-common
        run: |
          yarn check:lint
          yarn check:format
      - name: "@stlite/sharing-common: Build proto"
        id: sharing-common-proto
        if: ${{ !cancelled() && needs.changes.outputs.sharing-common == 'true' }}
        working-directory: packages/sharing-common
        run: yarn build:proto
      - name: "@stlite/sharing-common: Test"
        if: ${{ !cancelled() && steps.sharing-common-proto.outcome == 'success' }}
        working-directory: packages/sharing-common
        run: yarn test

      ## @stlite/sharing-editor
      - name: "@stlite/sharing-editor: Build @stlite/sharing-common"
        id: sharing-editor-deps
        if: ${{ !cancelled() && needs.changes.outputs.sharing-editor == 'true' }}
        run: make sharing-common
      - name: "@stlite/sharing-editor: Lint"
        if: ${{ !cancelled() && steps.sharing-editor-deps.outcome == 'success' }}
        working-directory: packages/sharing-editor
        run: |
          yarn check:lint
          yarn check:format
      - name: "@stlite/sharing-editor: Test"
        if: ${{ !cancelled() && steps.sharing-editor-deps.outcome == 'success' }}
        working-directory: packages/sharing-editor
        run: yarn test

      ## @stlite/cli
      # Generate `_proto/models.py` and `_runtime_version.py` first — pyright
      # follows imports through them, and the parity test exec's both bins
      # which import them at runtime. The JS bundle (`make cli`) is also
      # needed for the parity test, so build it here in one shot.
      - name: "@stlite/cli: Build cli + Python proto + Python runtime-version"
        id: cli-build
        if: ${{ !cancelled() && needs.changes.outputs.cli == 'true' }}
        run: |
          . .venv/bin/activate
          make cli cli-py-proto cli-py-runtime-version
      - name: "@stlite/cli: Lint (TS)"
        if: ${{ !cancelled() && steps.cli-build.outcome == 'success' }}
        run: |
          yarn workspace @stlite/cli check:lint
          yarn workspace @stlite/cli check:format
      - name: "@stlite/cli: Lint (Python)"
        if: ${{ !cancelled() && steps.cli-build.outcome == 'success' }}
        run: |
          . .venv/bin/activate
          uv run --project packages/cli/py ruff check packages/cli/py
          uv run --project packages/cli/py ruff format --check packages/cli/py
      - name: "@stlite/cli: Pyright (Python)"
        if: ${{ !cancelled() && steps.cli-build.outcome == 'success' }}
        run: |
          . .venv/bin/activate
          uv run --project packages/cli/py pyright packages/cli/py
      - name: "@stlite/cli: Pytest (Python)"
        if: ${{ !cancelled() && steps.cli-build.outcome == 'success' }}
        run: |
          . .venv/bin/activate
          uv run --project packages/cli/py pytest packages/cli/py/tests
      - name: "@stlite/cli: Vitest (TS, includes cross-runtime parity)"
        # vitest auto-detects CI=true and runs once instead of watching, so
        # no explicit `--run` flag needed.
        if: ${{ !cancelled() && steps.cli-build.outcome == 'success' }}
        run: yarn workspace @stlite/cli test

  test-windows:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.cloudflare == 'true' }}

    runs-on: windows-latest

    steps:
      # Submodules are needed only so the yarn workspace install can resolve all
      # members (the streamlit frontend workspaces); the tests themselves don't
      # touch the submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/init-all
        with:
          node-version-file: ${{ env.node-version-file }}
          protoc: false

      # @stlite/desktop contains OS-dependent file path manipulations differing
      # between POSIX and Windows.
      # Lint is skipped here because `git checkout` on Windows converts LF ->
      # CRLF (autocrlf default) and oxfmt 0.45.0 rejects `endOfLine: "auto"`
      # (only `lf`/`crlf`/`cr` are accepted), so `yarn check:format` fails on
      # every file. Lint/format correctness is platform-independent, so the
      # `test` job's run on Linux is sufficient. Revisit if oxfmt adds `"auto"`
      # support.
      - name: "@stlite/desktop: Test"
        if: ${{ !cancelled() && needs.changes.outputs.desktop == 'true' }}
        working-directory: packages/desktop
        run: yarn test

      # The stlite-cloudflare build is cross-platform; this is its Windows
      # coverage. It runs only the Node fs-helper tests, not the full build:
      # the end-to-end build can't be verified on Windows yet, because its one
      # required subprocess, `uv run pywrangler sync`, aborts there —
      # pywrangler (Cloudflare's workers-py) fails to locate its pyodide-venv
      # interpreter at `.venv-workers\pyodide-venv\Scripts\python.exe`. That's
      # upstream, not our code, so until it's fixed the full build runs on
      # Linux (verify-cloudflare-standalone) and these Node helper tests give
      # the Windows signal for our fs helpers.
      - name: "@stlite/cloudflare: Test (JS)"
        if: ${{ !cancelled() && needs.changes.outputs.cloudflare == 'true' }}
        working-directory: packages/cloudflare
        run: yarn test:js

  build-browser:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - uses: ./.github/actions/react-build-cache
        with:
          step: restore

      # PUBLIC_URL here is set as a relative path, which is possible to the trick introduced at https://github.com/whitphx/stlite/pull/143.
      - name: Set PUBLIC_URL
        run: echo "PUBLIC_URL=." >> $GITHUB_ENV
      - name: Build @stlite/browser
        run: |
          . .venv/bin/activate
          make browser

      - name: Upload bundle visualizer report (@stlite/browser)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/browser/stats/browser.html
          name: visualizer-browser
          if-no-files-found: error

      - name: Package
        working-directory: packages/browser
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/browser/package.tgz
          name: stlite-browser

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/browser/package.tgz
        # This step may fail when the PR is created by an external contributor and the CI is run in their scope.
        # We can ignore such failures because the following jobs such as E2E-testing in the post-build workflow don't necessarily need the attestation,
        # while the verification is done when publishing the artifact.
        continue-on-error: true

      - name: "Inform the package stats of @stlite/browser"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: browser
          name: "@stlite/browser"
          input-path: packages/browser/package.tgz
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

      # Also get stats of the built wheel files of stlite-lib and streamlit in this job.
      - name: Get the built wheel file path
        id: get-wheel-file-path
        run: |
          pushd packages/kernel/py/stlite-lib/dist
          echo "STLITE_LIB_WHEEL_FILEPATH=$(find $(pwd) -name "stlite_lib-*-py3-none-any.whl" -print -quit)" >> $GITHUB_OUTPUT
          popd
          pushd packages/kernel/py/streamlit/lib/dist
          echo "STREAMLIT_WHEEL_FILEPATH=$(find $(pwd) -name "streamlit-*.whl" -print -quit)" >> $GITHUB_OUTPUT
          popd
      - name: "Inform the package stats of stlite-lib wheel"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: stlite-lib-wheel
          name: "stlite-lib wheel (built as a part of @stlite/browser)"
          input-path: ${{ steps.get-wheel-file-path.outputs.STLITE_LIB_WHEEL_FILEPATH }}
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}
      - name: "Inform the package stats of streamlit wheel"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: streamlit-wheel
          name: "streamlit wheel (built as a part of @stlite/browser)"
          input-path: ${{ steps.get-wheel-file-path.outputs.STREAMLIT_WHEEL_FILEPATH }}
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

  build-react:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - uses: ./.github/actions/react-build-cache
        with:
          step: restore

      - name: Build @stlite/react
        run: |
          . .venv/bin/activate
          make react

      # The other jobs that build on @stlite/react restore this.
      - uses: ./.github/actions/react-build-cache
        with:
          step: save

      - name: Package
        working-directory: packages/react
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/react/package.tgz
