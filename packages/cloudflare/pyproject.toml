[project]
name = "stlite-cloudflare-tests"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pytest>=8.3", "pytest-asyncio>=0.24", "starlette>=0.40.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["py"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
