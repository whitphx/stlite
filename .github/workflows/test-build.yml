        working-directory: docs

      - name: Upload the built docs as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: docs/dist
          name: stlite-docs

      - name: Generate artifact attestation (docs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: docs/dist
        continue-on-error: true

      ## @stlite/cli
      - name: Build @stlite/cli
        run: |
          . .venv/bin/activate
          make cli

      - name: Package @stlite/cli
        working-directory: packages/cli
        run: yarn pack

      - name: Upload the built @stlite/cli tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/cli/package.tgz
          name: stlite-cli

      - name: Generate artifact attestation (@stlite/cli)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/cli/package.tgz
        continue-on-error: true

      - name: "Inform the package stats of @stlite/cli"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: cli
          name: "@stlite/cli"
          input-path: packages/cli/package.tgz
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

      ## @stlite/sharing-editor
      - name: Set build option envvar for the preview build
        if: ${{ env.BUILD_BRANCH != github.event.repository.default_branch }}
        run: echo "RESOLVE_SHARING_APP_URL_RUNTIME_FROM_EXTERNAL_FILE=true" >> $GITHUB_ENV
      - name: Set SHARING_APP_URL (main branch)
        if: ${{ env.BUILD_BRANCH == github.event.repository.default_branch }}
        run: echo "SHARING_APP_URL=https://share.stlite.net/" >> $GITHUB_ENV
      - name: Build @stlite/sharing-editor
        run: make sharing-editor

      - name: Upload bundle visualizer report (@stlite/sharing-editor)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/sharing-editor/stats/sharing-editor.html
          name: visualizer-sharing-editor
          if-no-files-found: error

      - name: Upload the built @stlite/sharing-editor as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/sharing-editor/dist
          name: stlite-sharing-editor

      - name: "Inform the package stats of @stlite/sharing-editor"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: sharing-editor
          name: "stlite sharing editor"
          input-path: packages/sharing-editor/dist
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

  build-desktop:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      - uses: ./.github/actions/react-build-cache
        with:
          step: restore

      - name: Build @stlite/desktop
        run: |
          . .venv/bin/activate
          make desktop

      - name: Upload bundle visualizer report (@stlite/desktop)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/desktop/stats/desktop.html
          name: visualizer-desktop
          if-no-files-found: error

      - name: Package
        working-directory: packages/desktop
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/desktop/package.tgz
          name: stlite-desktop

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/desktop/package.tgz
        # This step may fail when the PR is created by an external contributor and the CI is run in their scope.
        # We can ignore such failures because the following jobs such as E2E-testing in the post-build workflow don't necessarily need the attestation,
        # while the verification is done when publishing the artifact.
        continue-on-error: true

      - name: "Inform the package stats of @stlite/desktop"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: desktop
          name: "@stlite/desktop"
          input-path: packages/desktop/package.tgz
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

  build-cloudflare:
    # Unlike the always-built packages above, this build compiles the
    # Cloudflare-variant Streamlit frontend and builds the pinned runtime
    # wheels, so it only runs when the cloudflare package (or a dependency)
    # changed; RUN_ALL_TESTS makes that always true on main, which is what the
    # postbuild publish/deploy jobs rely on.
    if: ${{ needs.changes.outputs.cloudflare == 'true' }}
    needs: changes

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-all
        with:
          python-version-file: ${{ env.python-version-file }}
          node-version-file: ${{ env.node-version-file }}

      # @stlite/kernel and the wheels the Cloudflare build is made from, if
      # build-react has already built them from the same sources.
      - uses: ./.github/actions/react-build-cache
        with:
          step: restore

      - name: Build @stlite/cloudflare
        run: make cloudflare

      - name: Package
        working-directory: packages/cloudflare
        run: yarn pack

      - name: Upload the built tar ball as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: packages/cloudflare/package.tgz
          name: stlite-cloudflare

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/cloudflare/package.tgz
        continue-on-error: true

      - name: "Inform the package stats of @stlite/cloudflare"
        uses: ./.github/actions/set-package-stats
        continue-on-error: true
        with:
          key: cloudflare
          name: "@stlite/cloudflare"
          input-path: packages/cloudflare/package.tgz
          pr-number: ${{ env.BUILD_PR_NUMBER }}
          sticky-id: ${{ env.BUILD_HEAD_SHA }}

  verify-cloudflare-standalone:
    # Build the hello demo from the PACKED TARBALL, outside the monorepo, the way
    # a published-package user would (`npm i @stlite/cloudflare && stlite-
    # cloudflare build`). This is both the merge gate — proving the published
    # package builds the real demo end-to-end — and the producer of the artifact
    # that postbuild deploys. Building it here, in this PR-triggered no-secrets
    # context, is deliberate: postbuild only ever deploys the prebuilt artifact,
    # never runs PR build code with the deploy secrets. The streamlit submodule
    # isn't fetched; the tarball ships its own prebuilt frontend and wheels.
    #
    # ubuntu-only: Windows can't run the end-to-end build yet (see the pywrangler
    # note in the test-windows job above). Our own build code is
    # cross-platform and gets Windows coverage there via the helper tests.
    #
    # The scenarios run in parallel lanes: run one after another, they took
    # ~3.5 minutes. Each lane installs the tarball the same way.
    if: ${{ needs.changes.outputs.cloudflare == 'true' }}
    needs: [changes, build-cloudflare]

    strategy:
      fail-fast: false
      matrix:
        lane:
          # The hello sample as a plain Worker; postbuild deploys its build.
          - plain-worker
          # The default deployment mode, booted in a real browser.
          - durable-object
          # The wrangler-config shapes the merger supports.
          - configs
          # The --asset-runtime opt-out.
          - asset-runtime

    name: verify-cloudflare-standalone (${{ matrix.lane }})

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.node-version-file }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stlite-cloudflare
          path: ${{ runner.temp }}/pkg

      - name: Install the packed tarball
        working-directory: ${{ runner.temp }}
        env:
          # The lanes that smoke-test in a real browser install Playwright with
          # the rest, before anything runs from node_modules.
          PLAYWRIGHT: ${{ (matrix.lane == 'plain-worker' || matrix.lane == 'durable-object') && 'playwright@^1.61.1' || '' }}
        run: |
          set -eux
          mkdir -p standalone
          cd standalone
          npm init -y >/dev/null
          npm install "${{ runner.temp }}/pkg/package.tgz" wrangler $PLAYWRIGHT

      # Chromium and its system packages (apt) take 15s to 2 minutes to
      # install, depending on the mirror. They install in the background while
      # the lane builds its sample; the smoke test waits for them.
      - name: Start installing Playwright's Chromium
        if: ${{ matrix.lane == 'plain-worker' || matrix.lane == 'durable-object' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          nohup bash -c 'npx playwright install --with-deps chromium > "$RUNNER_TEMP/playwright-install.log" 2>&1; echo $? > "$RUNNER_TEMP/playwright-install.status.tmp"; mv "$RUNNER_TEMP/playwright-install.status.tmp" "$RUNNER_TEMP/playwright-install.status"' > /dev/null 2>&1 &

      - name: Build the hello sample from the packed tarball
        if: ${{ matrix.lane == 'plain-worker' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -eux
          cd standalone
          npx stlite-cloudflare build \
            "$GITHUB_WORKSPACE/packages/cloudflare/samples/hello/app" \
            -o ./dist --name stlite-cloudflare --plain-worker
          test -f dist/python_modules/stlite_cloudflare/entry.py
          test -d dist/python_modules/streamlit
          test -f dist/python_modules/_stlite_cloudflare_app/streamlit_app.py
          test -f dist/python_modules/_stlite_cloudflare_app/agri.csv.gz
          grep -q "window.__streamlit" dist/assets/index.html
          test ! -d dist/assets/_stlite

      # The default build ships the whole runtime in the script, which
      # Cloudflare caps at 64 MiB uncompressed (65536 KiB) on every plan. The
      # packaged runtime sits far below that; budget below the hard cap so a
      # regression that would break `wrangler deploy` fails here instead.
      - name: Validate the Worker bundle
        if: ${{ matrix.lane == 'plain-worker' }}
        working-directory: ${{ runner.temp }}/standalone/dist
        run: |
          set -eux
          npx wrangler deploy --dry-run | tee dry-run.log
          # Matching the unit too keeps the budget honest: were wrangler to
          # report MiB one day, the number alone would sail under the KiB
          # threshold, so an unmatched line has to fail the guard below.
          upload_kib=$(sed 's/\x1b\[[0-9;]*m//g' dry-run.log | grep -o 'Total Upload: [0-9.]* KiB' | grep -o '[0-9.]*' | head -1)
          test -n "$upload_kib"
          awk -v s="$upload_kib" 'BEGIN { if (s+0 > 61440) { print "Script upload " s " KiB exceeds the 61440 KiB budget (hard limit 65536)"; exit 1 } }'

      # wrangler dev runs the Worker in local workerd — the same runtime as
      # production — so this drives the packaged app end-to-end in a real
      # browser: index HTML, static assets, health endpoints, and the
      # Streamlit WebSocket session reaching CONNECTED.
      - name: Smoke-test the Worker in a real browser
        if: ${{ matrix.lane == 'plain-worker' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          { set +x; } 2>/dev/null
          until [ -f "$RUNNER_TEMP/playwright-install.status" ]; do sleep 2; done
          set -x
          cat "$RUNNER_TEMP/playwright-install.log"
          test "$(cat "$RUNNER_TEMP/playwright-install.status")" = 0
          cp "$GITHUB_WORKSPACE/packages/cloudflare/samples/hello/scripts/browser-smoke.mjs" .
          (cd dist && npx wrangler dev --port 8787 >"$RUNNER_TEMP/wrangler-dev.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8787/_stcore/health && break
            sleep 2
          done
          STLITE_SMOKE_TIMEOUT_MS=120000 node browser-smoke.mjs || {
            echo "::group::wrangler dev log"
            cat "$RUNNER_TEMP/wrangler-dev.log"
            echo "::endgroup::"
            exit 1
          }

      # The dist built above is the sample postbuild deploys. Hidden files are
      # excluded by default, dropping the build-only .venv/.venv-workers/.wrangler
      # dirs pywrangler leaves in the output — wrangler doesn't need them.
      - name: Upload the built sample as an artifact
        if: ${{ matrix.lane == 'plain-worker' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/standalone/dist
          name: stlite-cloudflare-sample

      # The default Durable Object deployment path gets its own standalone
      # build (the hello build above uses --plain-worker, which is a distinct
      # mode): the minimal sample built with default settings, verified
      # structurally and by wrangler dry-run.
      - name: Build the minimal sample in default Durable Object mode
        if: ${{ matrix.lane == 'durable-object' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          npx stlite-cloudflare build \
            "$GITHUB_WORKSPACE/packages/cloudflare/samples/minimal/app" \
            -o ./dist-do --name stlite-cloudflare-minimal
          grep -q '"STLITE_SERVER"' dist-do/wrangler.jsonc
          grep -q "StliteServer" dist-do/src/entry.py
          cd dist-do && npx wrangler deploy --dry-run

      # Boot the DO-mode Worker in local workerd: the health request goes
      # through the router entrypoint into the STLITE_SERVER Durable Object
      # instance, which cold-boots the packaged Streamlit runtime — the
      # actual default request-routing path.
      - name: Smoke-test the Durable Object mode in local workerd
        if: ${{ matrix.lane == 'durable-object' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          (cd dist-do && npx wrangler dev --port 8788 >"$RUNNER_TEMP/wrangler-dev-do.log" 2>&1 &)
          ok=""
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8788/_stcore/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::group::wrangler dev (DO) log"
            cat "$RUNNER_TEMP/wrangler-dev-do.log"
            echo "::endgroup::"
            exit 1
          fi
          curl -sf http://127.0.0.1:8788/ | grep -q "window.__streamlit"
          # Real-browser smoke in DO mode: renders over the WebSocket
          # session and asserts the Worker-env var surfaced via st.secrets.
          { set +x; } 2>/dev/null
          until [ -f "$RUNNER_TEMP/playwright-install.status" ]; do sleep 2; done
          set -x
          cat "$RUNNER_TEMP/playwright-install.log"
          test "$(cat "$RUNNER_TEMP/playwright-install.status")" = 0
          cp "$GITHUB_WORKSPACE/packages/cloudflare/samples/minimal/scripts/browser-smoke.mjs" ./minimal-smoke.mjs
          STLITE_CLOUDFLARE_URL=http://127.0.0.1:8788/ STLITE_SMOKE_TIMEOUT_MS=120000 node minimal-smoke.mjs || {
            echo "::group::wrangler dev (DO) log"
            cat "$RUNNER_TEMP/wrangler-dev-do.log"
            echo "::endgroup::"
            exit 1
          }

      # The same Durable Object build as the durable-object lane's: the
      # wrangler-config shapes below are dry-run against it.
      - name: Build the minimal sample in default Durable Object mode (for the config shapes)
        if: ${{ matrix.lane == 'configs' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          npx stlite-cloudflare build \
            "$GITHUB_WORKSPACE/packages/cloudflare/samples/minimal/app" \
            -o ./dist-do --name stlite-cloudflare-minimal
          grep -q '"STLITE_SERVER"' dist-do/wrangler.jsonc
          grep -q "StliteServer" dist-do/src/entry.py
          cd dist-do && npx wrangler deploy --dry-run

      # Every wrangler-config shape the merger supports (named environments,
      # legacy migrations, exports style, external bindings, ...) validated
      # against real wrangler.
      - name: Dry-run the supported wrangler-config shapes
        if: ${{ matrix.lane == 'configs' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          node "$GITHUB_WORKSPACE/packages/cloudflare/scripts/dryrun-config-matrix.mjs" dist-do

      # --asset-runtime is the opt-out from the default bundled script: the
      # runtime moves into static assets that package_loader.py fetches and
      # unpacks at cold start. Build it once and boot it in local workerd, so
      # that loader path keeps end-to-end coverage.
      - name: Build and boot an --asset-runtime Worker
        if: ${{ matrix.lane == 'asset-runtime' }}
        working-directory: ${{ runner.temp }}/standalone
        run: |
          set -eux
          npx stlite-cloudflare build \
            "$GITHUB_WORKSPACE/packages/cloudflare/samples/minimal/app" \
            -o ./dist-assets --name stlite-cloudflare-assets \
            --plain-worker --asset-runtime
          test ! -d dist-assets/python_modules/streamlit
          python3 -m zipfile -l dist-assets/assets/_stlite/python-modules.zip | grep -q "streamlit/"
          tar -tzf dist-assets/assets/_stlite/extracted-modules.tar.gz | grep -q "_stlite_cloudflare_app/streamlit_app.py"
          (cd dist-assets && npx wrangler deploy --dry-run)
          (cd dist-assets && npx wrangler dev --port 8789 >"$RUNNER_TEMP/wrangler-dev-assets.log" 2>&1 &)
          ok=""
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 -o /dev/null http://127.0.0.1:8789/_stcore/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::group::wrangler dev (--asset-runtime) log"
            cat "$RUNNER_TEMP/wrangler-dev-assets.log"
            echo "::endgroup::"
            exit 1
          fi

  # A single status check for branch protection to require. Requiring the
  # jobs above by name instead would silently leave every newly added job
  # unrequired, and would break whenever a matrix job's generated name
  # changes.
  test-build-all-green:
    # Not `always()`: that reports a failure for every run superseded by
    # `cancel-in-progress`, which is every push to a PR. `!cancelled()` still
    # runs the gate when a job above failed or skipped, which is the case
    # that has to be caught.
    if: ${{ !cancelled() }}
    needs:
      [
        changesets,
        changes,
        test-kernel,
        test,
        test-windows,
        build-browser,
        build-react,
        build-sharing,
        build-docs-cli-sharing-editor,
        build-desktop,
        build-cloudflare,
        verify-cloudflare-standalone,
      ]

    runs-on: ubuntu-latest

    steps:
      # A skip outside `allowed-skips` (a `needs` typo, a job dropped from
      # the graph) fails here instead of passing silently.
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            changesets,
            test-kernel,
            test,
            test-windows,
            build-cloudflare,
            verify-cloudflare-standalone
